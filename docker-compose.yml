version: '3.8'

services:
  semantic-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: agent_registry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  semantic-brain:
    build: .
    environment:
      - SEMANTIC_DB_HOST=semantic-db
      - SEMANTIC_DB_PORT=5432
      - SEMANTIC_DB_USER=postgres
      - SEMANTIC_DB_PASS=mysecretpassword
      - SEMANTIC_DB_NAME=agent_registry
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate # Hướng tới Ollama chạy ở máy host
    ports:
      - "3457:3457"
    depends_on:
      - semantic-db
    command: sh -c "sleep 5 && node maintenance/setup.js && npm run start"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  openai-proxy:
    build: .
    environment:
      - SEMANTIC_DB_HOST=semantic-db
      - SEMANTIC_DB_PORT=5432
      - SEMANTIC_DB_USER=postgres
      - SEMANTIC_DB_PASS=mysecretpassword
      - SEMANTIC_DB_NAME=agent_registry
      - PROXY_PORT=3458
      - SEMANTIC_PORT=3457
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
    ports:
      - "3458:3458"
    depends_on:
      - semantic-brain
    command: npm run proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  pgdata:
